version: "3.9"
services:
  coare-slurm:
    image: agaveapi/slurm:latest
    container_name: coare-slurm
    hostname: slurm
    ports: ["6817:6817", "6818:6818"]
    volumes: ["./tools/slurm:/jobs"]
    networks: [coare-net]

  coare-suite:
    image: ghcr.io/primordialomegazero/coare-autonomous-suite:latest
    container_name: coare-suite
    ports: ["9000:9000"]
    restart: unless-stopped
    networks: [coare-net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  coare-ckan:
    image: ckan/ckan:latest
    container_name: coare-ckan
    ports: ["5000:5000"]
    environment:
      - CKAN_SQLALCHEMY_URL=postgresql://ckan:ckan@db/ckan
    depends_on: [coare-db]
    volumes: ["ckan_data:/var/lib/ckan"]
    networks: [coare-net]

  coare-db:
    image: postgres:14
    container_name: coare-db
    environment:
      - POSTGRES_USER=ckan
      - POSTGRES_PASSWORD=ckan
    volumes: ["db_data:/var/lib/postgresql/data"]
    networks: [coare-net]

  # B5 FHE Engine (separate product — requires license)
  # coare-fhe:
  #   image: ghcr.io/primordialomegazero/dost-asti-fhe:latest
  #   container_name: coare-fhe
  #   ports: ["8086:8086"]
  #   networks: [coare-net]

volumes:
  ckan_data:
  db_data:

networks:
  coare-net:
    driver: bridge
