version: "3.9"
services:
  # COARE HPC Emulation
  coare-slurm:
    image: agaveapi/slurm:latest
    container_name: coare-slurm
    hostname: slurm
    ports: ["6817:6817", "6818:6818"]
    volumes: ["./tools/slurm:/jobs"]
  
  # COARE Autonomous Suite (Main)
  coare-suite:
    image: ghcr.io/primordialomegazero/coare-autonomous-suite:latest
    container_name: coare-suite
    ports: ["9000:9000"]
    restart: unless-stopped
  
  # CKAN Data Catalog
  coare-ckan:
    image: ckan/ckan:latest
    container_name: coare-ckan
    ports: ["5000:5000"]
    environment:
      - CKAN_SQLALCHEMY_URL=postgresql://ckan:ckan@db/ckan
    depends_on: [coare-db]
  
  # CKAN Database
  coare-db:
    image: postgres:14
    container_name: coare-db
    environment:
      - POSTGRES_USER=ckan
      - POSTGRES_PASSWORD=ckan

  # Optional: B5 FHE Engine (separate product, requires license)
  # Uncomment below if you have B5 FHE access:
  # coare-fhe:
  #   image: ghcr.io/primordialomegazero/dost-asti-fhe:latest
  #   container_name: coare-fhe
  #   ports: ["8086:8086"]
